plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tanush.wethree'
version = '1.0.0'

android {
  namespace "expo.modules.smsexpensereader"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // HeadlessJsTaskService (runs the sync while the app is closed). Version comes from the React Native gradle plugin.
  implementation 'com.facebook.react:react-android'
}
