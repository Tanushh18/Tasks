name: EAS Build (mobile)

on:
  # Temporarily manual-only while the app is re-linked to a new EAS project.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_T23267890 }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Create or link new EAS project
        working-directory: mobile
        run: eas init --account tanush18 --force --non-interactive

      - name: Build Android (preview)
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
