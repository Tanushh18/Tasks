name: EAS Build (mobile)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  # The push trigger above ignores changes to this file, so a fix to the workflow
  # itself can only be exercised by starting a run by hand.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_T23267890 }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Create or link new EAS project
        working-directory: mobile
        run: eas init --account tanushhh18 --force --non-interactive

      - name: Build Android APK (preview)
        working-directory: mobile
        # --no-wait is removed so the job blocks until the build finishes and
        # we can fetch the resulting APK URL for Firebase distribution below.
        run: eas build --platform android --profile preview --non-interactive --json > eas-build-output.json

      - name: Resolve build artifact URL
        working-directory: mobile
        run: |
          ARTIFACT_URL=$(node -e "console.log(require('./eas-build-output.json')[0].artifacts.buildUrl)")
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "undefined" ]; then
            echo "Could not resolve APK artifact URL from EAS build output" >&2
            exit 1
          fi
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl -L "$ARTIFACT_URL" -o app-preview.apk

      - name: Distribute APK to Firebase App Distribution testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app-preview.apk
          releaseNotes: ${{ github.event.head_commit.message }}
