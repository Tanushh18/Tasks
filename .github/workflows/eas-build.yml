name: EAS Build (mobile)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  # The push trigger above ignores changes to this file, so a fix to the workflow
  # itself can only be exercised by starting a run by hand.
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = real release (also publishes OTA to everyone on preview); test = test APK on its own channel, no OTA"
        type: choice
        options: [preview, test]
        default: preview
      testers:
        description: "Comma-separated tester emails for Firebase App Distribution"
        default: "tanushchawla16@gmail.com"
      apk_url:
        description: "Optional: skip the build and distribute this existing EAS APK URL to the testers"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_TANUSHCK84 }}

      - name: Install dependencies
        if: ${{ !inputs.apk_url }}
        working-directory: mobile
        run: npm ci

      - name: Create or link new EAS project
        if: ${{ !inputs.apk_url }}
        working-directory: mobile
        run: eas init --account tanushhhhh18 --force --non-interactive

      - name: Build Android APK (${{ inputs.profile || 'preview' }})
        if: ${{ !inputs.apk_url }}
        working-directory: mobile
        # --no-wait is removed so the job blocks until the build finishes and
        # we can fetch the resulting APK URL for Firebase distribution below.
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --json > eas-build-output.json

      - name: Resolve build artifact URL
        if: ${{ !inputs.apk_url }}
        working-directory: mobile
        run: |
          ARTIFACT_URL=$(node -e "console.log(require('./eas-build-output.json')[0].artifacts.buildUrl)")
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "undefined" ]; then
            echo "Could not resolve APK artifact URL from EAS build output" >&2
            exit 1
          fi
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: curl -fL "${APK_URL:-$ARTIFACT_URL}" -o app-preview.apk

      # Publishes this commit's JavaScript to the "preview" channel so installed APKs pick it up over
      # the air (see mobile/src/updates/useOtaUpdates.ts). Installed builds only accept updates that
      # share their runtimeVersion (the app version in app.json), so a native change needs the APK.
      # continue-on-error: a failed publish shows as a warning but must not block APK distribution.
      # Test builds never publish: that would push unreleased code to every installed preview app.
      - name: Publish OTA update to preview channel
        if: ${{ (inputs.profile || 'preview') == 'preview' && !inputs.apk_url }}
        working-directory: mobile
        continue-on-error: true
        env:
          # EAS Update doesn't read eas.json build env; without this the bundle falls back to localhost.
          EXPO_PUBLIC_API_URLS: https://tasks-g9h1.onrender.com/api, https://we-three-api.onrender.com/api
        run: |
          eas update --channel preview --message "$(git log -1 --pretty=%s)" --non-interactive

      - name: Distribute APK to Firebase App Distribution testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ inputs.testers || 'tanushchawla16@gmail.com' }}
          file: app-preview.apk
          releaseNotes: ${{ github.event.head_commit.message || format('{0} build from {1} ({2})', inputs.profile, github.ref_name, github.sha) }}
