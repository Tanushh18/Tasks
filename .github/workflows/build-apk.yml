name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      send_to_firebase:
        description: "Distribute APK to Firebase testers?"
        type: boolean
        default: true
      testers:
        description: "Comma-separated tester emails (if distributing)"
        default: "tanushchawla16@gmail.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build APK with Gradle
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Decode and place keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/debug.keystore

          # Build APK
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=app/debug.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD \
            -PMYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS \
            -PMYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Distribute to Firebase App Distribution
        if: ${{ inputs.send_to_firebase || github.event_name == 'push' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ inputs.testers || 'tanushchawla16@gmail.com' }}
          file: mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || format('Build from {0} ({1})', github.ref_name, github.sha) }}
