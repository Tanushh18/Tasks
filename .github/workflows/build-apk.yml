name: Build APK

# Runs by itself on every push to main that changes the app, and sends the APK to the Firebase testers.
# Also available by hand: Actions -> Build APK -> Run workflow. A commit message containing [skip ci] skips it.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      send_to_firebase:
        description: "Also send the APK to Firebase App Distribution testers"
        type: boolean
        default: true
      testers:
        description: "Comma-separated tester emails (only used with Firebase)"
        default: "tanushchawla16@gmail.com,tanushchawla21@gmail.com"

permissions:
  contents: write # publishes the APK to the rolling `apk-latest` release

# A newer push replaces a build that is still running instead of queueing behind it.
concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URLS: https://tasks-g9h1.onrender.com/api, https://we-three-api.onrender.com/api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Both are baked into the app: the runtime version decides which OTA bundles it accepts, the build time
      # makes sure a bundle published before this APK existed is never preferred over the one inside it.
      - name: Set build versions
        run: |
          NOW=$(date +%s)
          echo "OTA_VERSION=$NOW" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_OTA_VERSION=$NOW" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_RUNTIME_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"

      # Without these secrets the APK is signed with the Expo template's debug key (installable, and stable
      # between builds, but not a proper release key). Add all four secrets to sign with your own keystore.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not set - signing with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ runner.temp }}/app-release.apk
          retention-days: 30

      # Public, stable download link:
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/app-release.apk
      - name: Publish APK to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Runtime version $EXPO_PUBLIC_RUNTIME_VERSION, built from ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest APK" --notes "$NOTES" --latest=false
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest "$RUNNER_TEMP/app-release.apk" --clobber

      - name: Send APK to Firebase testers
        if: ${{ github.event_name == 'push' || inputs.send_to_firebase }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ inputs.testers || 'tanushchawla16@gmail.com,tanushchawla21@gmail.com' }}
          file: ${{ runner.temp }}/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || format('Manual build from {0}', github.sha) }}
