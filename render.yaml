# Render Blueprint: in the Render dashboard choose New -> Blueprint and pick this repo.
# Secrets (sync: false) are NOT stored here; Render asks you to type them once at setup.
services:
  - type: web
    name: we-three-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MONGO_URI
        sync: false
      # Quota shown in the admin Database storage screen (Atlas M0 free tier = 512 MB).
      - key: MONGODB_STORAGE_LIMIT_MB
        value: "512"
      - key: GEMINI_API_KEY
        sync: false
      # Cloudinary stores uploaded documents/photos. If unset, uploads fall back to MongoDB base64.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Outgoing email for "Email my money report". Without these the app offers Download Excel only.
      # Apps Script mailer. The URL alone can't send mail: the script also checks MAIL_WEBHOOK_SECRET.
      - key: MAIL_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbxyT4x3lYdTQzG31HZn2D14KZb-lzbkemDtV2Ef5GFHr-6Jm2-otgv0XFWO5mVCp3SI/exec
      - key: MAIL_WEBHOOK_SECRET
        sync: false
      # Must be IDENTICAL on every server the app can fail over to, or a login made on one
      # server is rejected by the other. Copy the same values from backend/.env.
      # SMS Service. Phones send SMS_DEVICE_KEY as their bearer token; the ggnHome website's hidden SMS console
      # sends SMS_CONSOLE_KEY. Use long random values; with either unset, that part of the API refuses everyone.
      - key: SMS_DEVICE_KEY
        sync: false
      - key: SMS_CONSOLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
